[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "bsx"
version = "0.1.0"
description = "Extract Brawl Stars (Supercell Odin) 3D models, skeletal animations and textures to standard glTF 2.0 and PNG from the command line."
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "bsx contributors" }]
keywords = ["brawl-stars", "supercell", "gltf", "glb", "sctx", "astc", "odin"]
classifiers = [
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Graphics :: 3D Modeling",
]
dependencies = [
  "click>=8.1",
  "flatbuffers>=24.3",
  "numpy>=1.26",
  "requests>=2.31",
  "Pillow>=10.0",
  "zstandard>=0.22",
  "texture2ddecoder>=1.0.5",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
bsx = "bsx.cli:main"

[project.urls]
Homepage = "https://github.com/Daniil-SV/gltf-Supercell-IO"

[tool.hatch.build.targets.wheel]
packages = ["src/bsx"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["src/bsx/flat/gltf_generated.py"]
